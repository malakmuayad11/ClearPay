<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClearPay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <div id="header"></div>
    <main class="hero">
      <div class="hero__container">
        <!-- Hero Content -->
        <div class="hero__content">
          <span class="hero__greeting">Smarter Payments. Brighter Future.</span>
          <h1 class="hero__title">ClearPay</h1>
          <p class="hero__role">Pay Smart. <span>Live Better.</span></p>

          <small class="hero__description">
            A modern fintech solution that helps you manage, track, and plan
            your payments with ease.
          </small>

          <div class="hero__actions">
            <button class="button--primary">
              <p>Start Now &rarr;</p>
            </button>

            <button class="button--secondary">
              <p>Learn More &darr;</p>
            </button>
          </div>
        </div>

        <!-- Hero Image -->
        <div class="hero__image">
          <img
            src="./assets/hero-img.png"
            alt="Hero Image"
            class="hero__profile-image"
          />
        </div>
      </div>
    </main>
    <div id="footer"></div>
    <script src="./scripts/layout.js" type="module"></script>
  </body>
</html>
