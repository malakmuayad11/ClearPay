<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClearPay - Contact</title>
    <!-- Standard favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="../assets/favicons/favicon.svg"
    />

    <!-- PNG fallback -->
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="../assets/favicons/android-touch-icon.png"
    />

    <!-- Apple Touch Icon -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../assets/favicons/apple-touch-icon.png"
    />
    <link rel="stylesheet" href="../styles/main.css" />
  </head>
  <body>
    <div id="header"></div>

    <main class="contact">
      <div class="contact__container animate-on-scroll">
        <!-- Contact Introduction -->
        <div class="contact__content">
          <span class="hero__greeting">Get in Touch</span>
          <h2 class="contact__title">We'd love to hear from you</h2>
          <p class="contact__description">
            Have a question or feedback? Our team is here to help.
          </p>

          <div class="contact__information">
            <div class="contact__information-item">
              <img
                src="../assets/icons/email-icon.svg"
                alt="Email Icon"
                class="contact__icon"
                loading="eager"
              />
              <a href="mailto:hello@clearpay.com">hello@clearpay.com</a>
            </div>

            <div class="contact__information-item">
              <img
                src="../assets/icons/phone-icon.svg"
                alt="Phone Icon"
                class="contact__icon"
              />
              <a href="tel:+966111234567">+966 11 123 4567</a>
            </div>

            <div class="contact__information-item">
              <img
                src="../assets/icons/location-icon.svg"
                alt="Location Icon"
                class="contact__icon"
                loading="eager"
              />
              <p>Riyadh, Saudi Arabia</p>
            </div>
          </div>
        </div>

        <!-- Contact Form -->
        <section class="contact-form-container">
          <form class="contact-form" action="#">
            <div class="contact-form__input">
              <label for="name">Name *</label>
              <input type="text" name="name" id="name" required />
            </div>

            <div class="contact-form__input">
              <label for="email">Email *</label>
              <input type="email" name="email" id="email" required />
            </div>

            <div class="contact-form__input">
              <label for="message">Message *</label>
              <textarea
                name="message"
                id="message"
                rows="5"
                required
              ></textarea>
            </div>

            <button
              type="submit"
              class="contact-form__button button--primary"
              id="send-btn"
            >
              Send Message &rarr;
            </button>
          </form>
        </section>
      </div>
    </main>

    <div id="footer"></div>
    <script type="module" src="../scripts/main.js"></script>
  </body>
</html>
